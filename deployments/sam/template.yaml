AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: VLP Vehicle Service on AWS SAM (Lambda + API Gateway).

Parameters:
  MongoUri:
    Type: String
    NoEcho: true
  MongoDb:
    Type: String
    Default: vlp
  MongoCollection:
    Type: String
    Default: vehicles

Globals:
  Function:
    Timeout: 20
    MemorySize: 512
    Architectures:
      - arm64

Resources:
  VehicleApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod

  VehicleServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../services/vehicle-service
      Handler: bootstrap
      Runtime: provided.al2023
      # Für Custom Runtime Build per Makefile:
      Metadata:
        BuildMethod: makefile
      Environment:
        Variables:
          SERVICE_NAME: vehicle-service
          MONGO_URI: !Ref MongoUri
          MONGO_DB: !Ref MongoDb
          MONGO_COLLECTION: !Ref MongoCollection
      Events:
        AnyRoute:
          Type: Api
          Properties:
            RestApiId: !Ref VehicleApi
            Path: /{proxy+}
            Method: ANY
        RootRoute:
          Type: Api
          Properties:
            RestApiId: !Ref VehicleApi
            Path: /
            Method: ANY

Outputs:
  ApiUrl:
    Description: API Gateway base URL
    Value: !Sub "https://${VehicleApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
